name: tdtK Analyzer (Python app)

on:
  push:
    paths: ["tdtk-analyzer/**", ".github/workflows/tdtk-analyzer.yml"]
  pull_request:
    paths: ["tdtk-analyzer/**", ".github/workflows/tdtk-analyzer.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tdtk-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Qt (headless GUI tests)
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tdtk-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Build standalone app
        working-directory: tdtk-analyzer/packaging
        run: pyinstaller tdtk-analyzer.spec --noconfirm
      # artifact zips drop the executable bit, so the macOS/Linux apps are packed with tar first
      - name: Pack app (macOS)
        if: runner.os == 'macOS'
        working-directory: tdtk-analyzer/packaging/dist
        run: tar -czf ../tdtK-Heart-Analyzer-macOS.tar.gz "tdtK Heart Analyzer.app"
      - name: Pack app (Linux)
        if: runner.os == 'Linux'
        working-directory: tdtk-analyzer/packaging/dist
        run: tar -czf ../tdtK-Heart-Analyzer-Linux.tar.gz tdtK-Heart-Analyzer
      - uses: actions/upload-artifact@v4
        with:
          name: tdtK-Heart-Analyzer-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'tdtk-analyzer/packaging/dist/' || format('tdtk-analyzer/packaging/tdtK-Heart-Analyzer-{0}.tar.gz', runner.os) }}
          if-no-files-found: error
