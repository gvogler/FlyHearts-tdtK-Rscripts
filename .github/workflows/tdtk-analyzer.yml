name: tdtK Analyzer (Python app)

on:
  push:
    paths: ["tdtk-analyzer/**", ".github/workflows/tdtk-analyzer.yml"]
    # a tag like tdtk-analyzer-v1.0.0 publishes the apps as a GitHub Release (path filters do not apply to tags)
    tags: ["tdtk-analyzer-v*"]
  pull_request:
    paths: ["tdtk-analyzer/**", ".github/workflows/tdtk-analyzer.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    # GitHub publishes no Python 3.9 (end of life) for newer Ubuntu images
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: tdtk-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries for Qt (headless GUI tests)
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tdtk-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # the real Windows display backend (the runner has a desktop); Qt's 'offscreen' backend has
      # no fixed-width system font on Windows, unlike the app as users run it
      - run: pytest -q
        env:
          QT_QPA_PLATFORM: windows

  build:
    needs: [test, test-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tdtk-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Build standalone app
        working-directory: tdtk-analyzer/packaging
        run: pyinstaller tdtk-analyzer.spec --noconfirm
      # the built executables analyse synthetic movies in five formats and open the GUI
      - name: Smoke test of the built app
        run: python packaging/smoke_test.py packaging/dist/tdtK-Heart-Analyzer
        timeout-minutes: 20
      - name: Windows installer and portable zip
        if: runner.os == 'Windows'
        working-directory: tdtk-analyzer/packaging
        shell: pwsh
        run: |
          $version = python -c "import tdtk_analyzer; print(tdtk_analyzer.__version__)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist\tdtK-Heart-Analyzer -DestinationPath "installer\tdtK-Heart-Analyzer-$version-Windows-portable.zip"
          Get-ChildItem installer
      - name: Install, start and uninstall (Windows)
        if: runner.os == 'Windows'
        working-directory: tdtk-analyzer/packaging
        shell: pwsh
        timeout-minutes: 10
        run: |
          $setup = (Get-ChildItem installer\*Setup*.exe | Select-Object -First 1).FullName
          $dir = "$env:RUNNER_TEMP\tdtk-install"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$dir" -Wait
          & "$dir\tdtk-analyzer-cli.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:TDTK_ANALYZER_SELFTEST = "1"
          $p = Start-Process "$dir\tdtK-Heart-Analyzer.exe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "GUI exit code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\tdtK Heart Analyzer.lnk")) {
            Write-Error "Start menu shortcut missing"; exit 1 }
          Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # the uninstaller continues in a copy of itself: wait until the files are gone
          for ($i = 0; $i -lt 60 -and (Test-Path "$dir\tdtK-Heart-Analyzer.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\tdtK-Heart-Analyzer.exe") { Write-Error "uninstall left the app behind"; exit 1 }
          Write-Host "installer OK"
      # artifact zips drop the executable bit, so the macOS/Linux apps are packed with tar first
      - name: Pack app (macOS)
        if: runner.os == 'macOS'
        working-directory: tdtk-analyzer/packaging/dist
        run: tar -czf ../tdtK-Heart-Analyzer-macOS.tar.gz "tdtK Heart Analyzer.app"
      - name: Pack app (Linux)
        if: runner.os == 'Linux'
        working-directory: tdtk-analyzer/packaging/dist
        run: tar -czf ../tdtK-Heart-Analyzer-Linux.tar.gz tdtK-Heart-Analyzer
      - uses: actions/upload-artifact@v4
        with:
          name: tdtK-Heart-Analyzer-${{ runner.os }}
          path: ${{ runner.os == 'Windows' && 'tdtk-analyzer/packaging/installer/' || format('tdtk-analyzer/packaging/tdtK-Heart-Analyzer-{0}.tar.gz', runner.os) }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/tdtk-analyzer-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - id: kind
        # versions with letters (1.0.0a1, 1.0.0rc1) are marked as pre-releases
        run: |
          v="${GITHUB_REF_NAME#tdtk-analyzer-v}"
          if [[ "$v" =~ [a-z] ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          prerelease: ${{ steps.kind.outputs.pre }}
          generate_release_notes: true
